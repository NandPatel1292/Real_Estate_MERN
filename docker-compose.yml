version: '3.8'

services:
  api:
    build: ./api
    ports:
      - "5000:5000"
    env_file:
      - ./api/.env
    volumes:
      - ./api:/app
      - /app/node_modules
    networks:
      - mern-estate

  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - mern-estate

networks:
  mern-estate:
    driver: bridge
